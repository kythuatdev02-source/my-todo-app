<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ứng dụng To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Ghi chú công việc</h1>
        
        <div class="input-section">
            <input type="text" id="todo-input" placeholder="Bạn cần làm gì hôm nay?">
            <button id="add-btn">Thêm</button>
        </div>

        <ul id="todo-list">
            <!-- Danh sách công việc sẽ hiện ở đây -->
        </ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
