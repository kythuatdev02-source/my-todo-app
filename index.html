<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gia Đình Hạnh Phúc</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #FAFAFA; }
    .glass-effect { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
    .hide { display: none !important; }
    /* Tùy chỉnh thanh cuộn ẩn cho đẹp */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  </style>
</head>
<body class="text-gray-800 antialiased h-screen flex justify-center bg-gray-200">

  <!-- MÀN HÌNH ĐĂNG NHẬP / ĐĂNG KÝ -->
  <div id="auth-screen" class="w-full max-w-md h-full bg-[#FFF9F2] flex flex-col justify-center items-center p-6 relative">
    <div class="w-full bg-white p-8 rounded-3xl shadow-lg border border-orange-100">
      <div class="text-center mb-6">
        <div class="w-16 h-16 bg-orange-100 rounded-full flex items-center justify-center mx-auto mb-3">
          <i class="fa-solid fa-house-chimney-heart text-3xl text-orange-400"></i>
        </div>
        <h2 id="auth-title" class="text-2xl font-bold text-gray-800">Đăng Nhập</h2>
        <p class="text-gray-500 text-sm mt-1">Không gian riêng của gia đình ta</p>
      </div>

      <form id="auth-form" class="space-y-4">
        <div id="name-field" class="hide">
          <label class="block text-sm font-medium text-gray-700 mb-1">Tên hiển thị</label>
          <input type="text" id="auth-name" placeholder="VD: Bố Tuấn, Mẹ Lan" class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:outline-none focus:ring-2 focus:ring-orange-300">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email (Gmail)</label>
          <input type="email" id="auth-email" required placeholder="nhaminh@gmail.com" class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:outline-none focus:ring-2 focus:ring-orange-300">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Mật khẩu</label>
          <input type="password" id="auth-password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:outline-none focus:ring-2 focus:ring-orange-300">
        </div>
        <button type="submit" id="auth-btn" class="w-full py-3 mt-2 bg-orange-400 hover:bg-orange-500 text-white font-semibold rounded-xl shadow-md transition duration-300">
          Vào nhà ngay
        </button>
      </form>

      <div class="mt-6 text-center text-sm text-gray-500">
        <span id="auth-prompt-text">Chưa có tài khoản?</span> 
        <button id="auth-toggle-btn" class="text-orange-500 font-semibold hover:underline">Đăng ký ngay</button>
      </div>
    </div>
  </div>

  <!-- ỨNG DỤNG CHÍNH -->
  <div id="main-app" class="hide w-full max-w-md h-full bg-[#FFF9F2] flex flex-col relative shadow-xl overflow-hidden">
    
    <!-- HEADER -->
    <header class="glass-effect pt-12 pb-4 px-6 flex justify-between items-center sticky top-0 z-20 border-b border-orange-100">
      <div class="flex items-center space-x-3">
        <img id="header-avatar" src="https://ui-avatars.com/api/?name=G&background=FDBA74&color=fff" class="w-10 h-10 rounded-full shadow-sm object-cover" alt="Logo">
        <div>
          <h1 class="font-bold text-lg leading-tight text-gray-800">Gia đình mình</h1>
          <p id="current-user-name" class="text-xs text-gray-500">Đang tải...</p>
        </div>
      </div>
    </header>

    <main class="flex-1 overflow-y-auto pb-24 relative" id="main-content">
      
      <!-- TAB: BẢNG TIN -->
      <section id="tab-feed" class="p-4 space-y-6">
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
          <textarea id="post-text" placeholder="Hôm nay nhà mình có gì vui?" class="w-full bg-gray-50 rounded-xl p-3 text-sm focus:outline-none resize-none" rows="2"></textarea>
          <div class="flex justify-between items-center mt-3">
            <label class="cursor-pointer text-orange-400 p-2 bg-orange-50 rounded-full hover:bg-orange-100 transition">
              <i class="fa-regular fa-image"></i> Thêm ảnh
              <input type="file" id="post-image" class="hidden" accept="image/*">
            </label>
            <button id="btn-post" class="bg-gray-800 text-white px-5 py-2 rounded-full text-sm font-medium hover:bg-gray-700 transition">Đăng bài</button>
          </div>
          <p id="upload-status" class="text-xs text-orange-500 mt-2 hidden">Đang xử lý ảnh...</p>
        </div>
        <div id="posts-container" class="space-y-5"></div>
      </section>

      <!-- TAB: TRÒ CHUYỆN -->
      <section id="tab-chat" class="hide p-4 h-full flex flex-col">
        <h2 class="text-xl font-bold mb-4 text-center">Trò chuyện chung</h2>
        <div id="chat-messages" class="flex-1 overflow-y-auto bg-white rounded-2xl shadow-sm p-4 space-y-3 mb-4 border border-gray-100"></div>
        <div class="flex space-x-2">
          <input type="text" id="chat-input" placeholder="Nhắn tin..." class="flex-1 bg-white border border-gray-200 rounded-full px-4 py-2 focus:outline-none focus:ring-2 focus:ring-orange-200 text-sm">
          <button id="btn-send-chat" class="w-10 h-10 bg-orange-400 text-white rounded-full flex items-center justify-center hover:bg-orange-500 shadow-md">
            <i class="fa-solid fa-paper-plane text-sm"></i>
          </button>
        </div>
      </section>

      <!-- TAB: TRANG CÁ NHÂN -->
      <section id="tab-profile" class="hide">
        <!-- Ảnh bìa -->
        <div id="profile-cover" class="h-40 w-full bg-orange-200 bg-cover bg-center"></div>
        
        <div class="px-6 relative text-center pb-6">
          <!-- Ảnh đại diện -->
          <img id="profile-avatar" src="https://ui-avatars.com/api/?name=User" class="w-24 h-24 rounded-full mx-auto -mt-12 border-4 border-[#FFF9F2] shadow-md object-cover bg-white">
          
          <h2 id="profile-name" class="text-2xl font-bold text-gray-800 mt-2">Tên Thành Viên</h2>
          <p id="profile-email" class="text-gray-500 text-xs mb-2">email@gmail.com</p>
          <p id="profile-bio" class="text-gray-600 text-sm italic mb-4">"Chưa có tiểu sử"</p>
          
          <div class="flex justify-center space-x-2 mb-6">
            <button id="btn-edit-profile" class="px-4 py-2 bg-white border border-gray-200 text-gray-700 text-sm font-medium rounded-xl shadow-sm hover:bg-gray-50">
              <i class="fa-solid fa-pen mr-1 text-xs"></i> Chỉnh sửa hồ sơ
            </button>
            <button id="btn-logout" class="px-4 py-2 bg-red-50 text-red-500 text-sm font-medium rounded-xl hover:bg-red-100">
              Đăng xuất
            </button>
          </div>

          <!-- Bộ sưu tập (Gallery) -->
          <div class="text-left">
            <h3 class="font-bold text-gray-800 mb-3"><i class="fa-regular fa-images text-orange-400 mr-1"></i> Bộ sưu tập của tôi</h3>
            <div id="gallery-container" class="grid grid-cols-3 gap-2">
              <!-- Ảnh sẽ được load ở đây -->
            </div>
            <p id="gallery-empty" class="text-sm text-gray-400 text-center py-4 hidden">Chưa có hình ảnh nào.</p>
          </div>
        </div>
      </section>
    </main>

    <!-- NAVIGATION BAR -->
    <nav class="glass-effect absolute bottom-0 w-full px-6 py-4 flex justify-between items-center pb-8 rounded-t-3xl border-t border-orange-50">
      <button class="nav-btn active flex flex-col items-center text-orange-500 transition-colors" data-target="tab-feed">
        <i class="fa-solid fa-house text-xl mb-1"></i>
        <span class="text-[10px] font-medium">Bảng tin</span>
      </button>
      <button class="nav-btn flex flex-col items-center text-gray-400 hover:text-orange-400 transition-colors" data-target="tab-chat">
        <i class="fa-regular fa-comment-dots text-xl mb-1"></i>
        <span class="text-[10px] font-medium">Trò chuyện</span>
      </button>
      <button class="nav-btn flex flex-col items-center text-gray-400 hover:text-orange-400 transition-colors" data-target="tab-profile">
        <i class="fa-regular fa-user text-xl mb-1"></i>
        <span class="text-[10px] font-medium">Cá nhân</span>
      </button>
    </nav>
  </div>

  <!-- MODAL CHỈNH SỬA HỒ SƠ -->
  <div id="edit-modal" class="hide fixed inset-0 bg-black bg-opacity-50 z-50 flex justify-center items-center p-4">
    <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl relative max-h-[90vh] overflow-y-auto">
      <button id="btn-close-modal" class="absolute top-4 right-4 text-gray-400 hover:text-gray-700">
        <i class="fa-solid fa-xmark text-xl"></i>
      </button>
      <h3 class="text-lg font-bold mb-4">Chỉnh sửa hồ sơ</h3>
      
      <div class="space-y-4 text-left">
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1">Tên hiển thị</label>
          <input type="text" id="edit-name" class="w-full border rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-orange-300">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1">Tiểu sử</label>
          <input type="text" id="edit-bio" placeholder="Viết vài lời giới thiệu..." class="w-full border rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-orange-300">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1">Ảnh đại diện (Avatar)</label>
          <input type="file" id="edit-avatar" accept="image/*" class="w-full text-xs">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1">Ảnh bìa (Cover)</label>
          <input type="file" id="edit-cover" accept="image/*" class="w-full text-xs">
        </div>
        <p id="edit-status" class="text-xs text-orange-500 hidden">Đang lưu dữ liệu...</p>
        <button id="btn-save-profile" class="w-full bg-orange-400 text-white font-semibold py-2 rounded-xl mt-2 hover:bg-orange-500">
          Lưu thay đổi
        </button>
      </div>
    </div>
  </div>

  <!-- FIREBASE & LOGIC SCRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, getDoc, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 1. CẤU HÌNH FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyCDNmV22B2V6UVnzLCPJt4NirKUUL0irmE",
      authDomain: "appgiadinh-e0208.firebaseapp.com",
      projectId: "appgiadinh-e0208",
      storageBucket: "appgiadinh-e0208.firebasestorage.app",
      messagingSenderId: "256427273679",
      appId: "1:256427273679:web:2b18c6c65ec5598c56b6ba"
    };
    
    // API KEY IMGBB CỦA BẠN
    const IMGBB_API_KEY = "94f5ba0e0cc17191235900b669821e96";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let userProfileData = {}; // Lưu thông tin phụ (bio, cover, avatar link)
    let isLoginMode = true;

    // --- HÀM UPLOAD ẢNH QUA IMGBB ---
    async function uploadToImgBB(file) {
      const formData = new FormData();
      formData.append("image", file);
      try {
        const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
          method: "POST",
          body: formData
        });
        const data = await response.json();
        if (data.success) return data.data.url;
        throw new Error("Lỗi kết nối ImgBB");
      } catch (err) {
        console.error(err);
        return null;
      }
    }

    // --- XỬ LÝ GIAO DIỆN ĐĂNG NHẬP ---
    const authToggleBtn = document.getElementById('auth-toggle-btn');
    authToggleBtn.addEventListener('click', () => {
      isLoginMode = !isLoginMode;
      document.getElementById('auth-title').innerText = isLoginMode ? "Đăng Nhập" : "Tạo Tài Khoản";
      document.getElementById('name-field').classList.toggle('hide', isLoginMode);
      document.getElementById('auth-btn').innerText = isLoginMode ? "Vào nhà ngay" : "Đăng ký thành viên";
      document.getElementById('auth-prompt-text').innerText = isLoginMode ? "Chưa có tài khoản?" : "Đã là thành viên?";
      authToggleBtn.innerText = isLoginMode ? "Đăng ký ngay" : "Đăng nhập";
    });

    document.getElementById('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('auth-email').value;
      const pass = document.getElementById('auth-password').value;
      const name = document.getElementById('auth-name').value;
      const btn = document.getElementById('auth-btn');
      
      btn.innerText = "Đang xử lý...";
      try {
        if (isLoginMode) {
          await signInWithEmailAndPassword(auth, email, pass);
        } else {
          const cred = await createUserWithEmailAndPassword(auth, email, pass);
          await updateProfile(cred.user, { displayName: name });
          // Tạo database profile cho user mới
          await setDoc(doc(db, "users", cred.user.uid), {
            bio: "Xin chào gia đình!",
            avatarUrl: `https://ui-avatars.com/api/?name=${name}&background=FDBA74&color=fff`,
            coverUrl: ""
          });
        }
      } catch (error) {
        alert("Lỗi: " + error.message);
        btn.innerText = isLoginMode ? "Vào nhà ngay" : "Đăng ký thành viên";
      }
    });

    document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

    // --- LẮNG NGHE TRẠNG THÁI ĐĂNG NHẬP ---
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        document.getElementById('auth-screen').classList.add('hide');
        document.getElementById('main-app').classList.remove('hide');
        await loadUserProfile();
        loadPosts();
        loadChat();
      } else {
        currentUser = null;
        document.getElementById('auth-screen').classList.remove('hide');
        document.getElementById('main-app').classList.add('hide');
      }
    });

    // --- XỬ LÝ HỒ SƠ (PROFILE) ---
    async function loadUserProfile() {
      const docSnap = await getDoc(doc(db, "users", currentUser.uid));
      if (docSnap.exists()) {
        userProfileData = docSnap.data();
      } else {
        userProfileData = { avatarUrl: `https://ui-avatars.com/api/?name=${currentUser.displayName}`, bio: "", coverUrl: "" };
      }
      
      // Update UI
      const dName = currentUser.displayName || "Thành viên";
      const avatar = userProfileData.avatarUrl;
      document.getElementById('current-user-name').innerText = "Chào " + dName;
      document.getElementById('header-avatar').src = avatar;
      document.getElementById('profile-name').innerText = dName;
      document.getElementById('profile-email').innerText = currentUser.email;
      document.getElementById('profile-bio').innerText = userProfileData.bio || "Chưa có tiểu sử";
      document.getElementById('profile-avatar').src = avatar;
      if (userProfileData.coverUrl) {
        document.getElementById('profile-cover').style.backgroundImage = `url('${userProfileData.coverUrl}')`;
      }
    }

    // Modal Edit Profile
    document.getElementById('btn-edit-profile').addEventListener('click', () => {
      document.getElementById('edit-name').value = currentUser.displayName;
      document.getElementById('edit-bio').value = userProfileData.bio || "";
      document.getElementById('edit-modal').classList.remove('hide');
    });
    document.getElementById('btn-close-modal').addEventListener('click', () => document.getElementById('edit-modal').classList.add('hide'));

    document.getElementById('btn-save-profile').addEventListener('click', async () => {
      const newName = document.getElementById('edit-name').value;
      const newBio = document.getElementById('edit-bio').value;
      const avatarFile = document.getElementById('edit-avatar').files[0];
      const coverFile = document.getElementById('edit-cover').files[0];
      const statusText = document.getElementById('edit-status');
      
      statusText.classList.remove('hidden');
      statusText.innerText = "Đang lưu...";

      let newAvatarUrl = userProfileData.avatarUrl;
      let newCoverUrl = userProfileData.coverUrl;

      if (avatarFile) newAvatarUrl = await uploadToImgBB(avatarFile) || newAvatarUrl;
      if (coverFile) newCoverUrl = await uploadToImgBB(coverFile) || newCoverUrl;

      try {
        if (newName !== currentUser.displayName) {
          await updateProfile(currentUser, { displayName: newName });
        }
        await setDoc(doc(db, "users", currentUser.uid), {
          bio: newBio,
          avatarUrl: newAvatarUrl,
          coverUrl: newCoverUrl
        }, { merge: true });
        
        await loadUserProfile();
        document.getElementById('edit-modal').classList.add('hide');
        alert("Cập nhật thành công!");
      } catch (err) {
        alert("Lỗi cập nhật: " + err.message);
      }
      statusText.classList.add('hidden');
    });

    // --- ĐĂNG BÀI (POSTS) & GALLERY ---
    document.getElementById('btn-post').addEventListener('click', async () => {
      const text = document.getElementById('post-text').value.trim();
      const fileInput = document.getElementById('post-image');
      const file = fileInput.files[0];
      const statusText = document.getElementById('upload-status');
      const btn = document.getElementById('btn-post');

      if (!text && !file) return alert('Hãy viết gì đó hoặc chọn ảnh nhé!');

      btn.disabled = true;
      statusText.classList.remove('hidden');

      try {
        let imageUrl = "";
        if (file) {
          imageUrl = await uploadToImgBB(file);
          if (!imageUrl) throw new Error("Upload ảnh thất bại");
        }

        await addDoc(collection(db, "posts"), {
          content: text,
          imageUrl: imageUrl,
          authorName: currentUser.displayName,
          authorId: currentUser.uid,
          authorAvatar: userProfileData.avatarUrl || "",
          createdAt: serverTimestamp()
        });

        // Reset
        document.getElementById('post-text').value = '';
        fileInput.value = '';
      } catch (error) {
        alert("Lỗi khi đăng bài: " + error.message);
      }
      statusText.classList.add('hidden');
      btn.disabled = false;
    });

    function loadPosts() {
      const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
      onSnapshot(q, (snapshot) => {
        const container = document.getElementById('posts-container');
        const galleryContainer = document.getElementById('gallery-container');
        
        container.innerHTML = '';
        galleryContainer.innerHTML = '';
        let myPhotosCount = 0;

        snapshot.forEach((doc) => {
          const post = doc.data();
          // Render Feed
          const timeString = post.createdAt ? new Date(post.createdAt.toDate()).toLocaleString('vi-VN') : 'Vừa xong';
          let imageHTML = post.imageUrl ? `<img src="${post.imageUrl}" class="w-full h-48 object-cover rounded-xl mb-3 mt-2 border border-gray-100">` : '';
          let avatarImg = post.authorAvatar || `https://ui-avatars.com/api/?name=${post.authorName}`;

          container.innerHTML += `
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
              <div class="flex items-center space-x-3 mb-2">
                <img src="${avatarImg}" class="w-10 h-10 rounded-full object-cover">
                <div>
                  <h3 class="font-semibold text-gray-800 text-sm">${post.authorName}</h3>
                  <p class="text-xs text-gray-400">${timeString}</p>
                </div>
              </div>
              ${post.content ? `<p class="text-gray-700 text-sm mb-2">${post.content}</p>` : ''}
              ${imageHTML}
            </div>
          `;

          // Cập nhật Gallery cá nhân
          if (post.authorId === currentUser.uid && post.imageUrl) {
            myPhotosCount++;
            galleryContainer.innerHTML += `
              <div class="aspect-square bg-gray-100 rounded-lg overflow-hidden border border-gray-200">
                <img src="${post.imageUrl}" class="w-full h-full object-cover hover:scale-110 transition-transform">
              </div>
            `;
          }
        });

        document.getElementById('gallery-empty').classList.toggle('hidden', myPhotosCount > 0);
      });
    }

    // --- CHAT (TRÒ CHUYỆN) ---
    document.getElementById('btn-send-chat').addEventListener('click', async () => {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      await addDoc(collection(db, "chats"), {
        text: text,
        authorName: currentUser.displayName,
        authorId: currentUser.uid,
        createdAt: serverTimestamp()
      });
    });

    function loadChat() {
      const q = query(collection(db, "chats"), orderBy("createdAt", "asc"));
      onSnapshot(q, (snapshot) => {
        const container = document.getElementById('chat-messages');
        container.innerHTML = '';
        snapshot.forEach((doc) => {
          const chat = doc.data();
          const isMine = chat.authorId === currentUser.uid;
          container.innerHTML += `
            <div class="flex flex-col ${isMine ? 'items-end' : 'items-start'}">
              <span class="text-[10px] text-gray-400 mb-1 ml-1">${isMine ? 'Bạn' : chat.authorName}</span>
              <div class="max-w-[75%] px-4 py-2 rounded-2xl text-sm ${isMine ? 'bg-orange-400 text-white rounded-br-sm' : 'bg-gray-100 text-gray-800 rounded-bl-sm'}">
                ${chat.text}
              </div>
            </div>
          `;
        });
        container.scrollTop = container.scrollHeight;
      });
    }

    // --- ĐIỀU HƯỚNG TABS ---
    const navBtns = document.querySelectorAll('.nav-btn');
    const sections = ['tab-feed', 'tab-chat', 'tab-profile'];
    navBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        navBtns.forEach(b => { b.classList.remove('text-orange-500', 'active'); b.classList.add('text-gray-400'); });
        btn.classList.add('text-orange-500', 'active');
        btn.classList.remove('text-gray-400');
        const targetId = btn.getAttribute('data-target');
        sections.forEach(id => document.getElementById(id).classList.toggle('hide', id !== targetId));
      });
    });
  </script>
</body>
</html>
